[project]
name = "arxiv-classifier"
version = "0.1.0"
description = "Multi-label arXiv abstract classifier and Django REST API"
requires-python = "==3.11.*"
dependencies = [
  "django==5.2.17",
  "djangorestframework==3.18.0",
  "huggingface-hub==0.36.2",
  "numpy==1.26.4",
  "pylatexenc==2.11",
  "scikit-learn==1.9.0",
  "torch==2.6.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
training = ["optuna==4.9.0"]
dev = ["pytest==8.4.2", "pytest-django==4.14.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.uv]
package = false
